<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>나의 버킷리스트</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 650px;
        margin: 50px auto;
        background-color: #fffdf0;
        color: #333;
      }
      h1 {
        text-align: center;
        font-size: 2rem;
        color: #ff6b35;
      }
      h2 {
        border-left: 5px solid #ff6b35;
        padding-left: 10px;
        margin-top: 30px;
      }
      li {
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <!-- 로컬에서는 이렇게 수정 -->
    <h1>🪣 나의 인생 버킷리스트</h1>
    <p>죽기 전에 꼭 해보고 싶은 것들</p>

    <h2>✈️ 여행</h2>
    <ul>
      <li>일본 도쿄로 여행가기</li>
      <li>태국 송크란 축제 즐기기</li>
      <li>몽골 초원의 게르에서 생활해보기</li>
      <li>히말라야 트래킹코스 가보기</li>
    </ul>

    <h2>💪 도전</h2>
    <ul>
      <li>10km 마라톤 참여하기</li>
      <li>5kg 감량하기</li>
      <li>코드잇 스프린트 완주하기</li>
      <li>하이록스 완주하기</li>
    </ul>

    <h2>💻 개발자 목표</h2>
    <ul>
      <li>캐주얼 게임 만들어서 서비스해보기</li>
      <li>사람들에게 도움을 줄 수 있는 플랫폼 서비스 개발하기</li>
    </ul>
  </body>
</html>
